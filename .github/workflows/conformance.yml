name: conformance

# Two jobs on purpose.
#
#   runner-selftest  proves the runner AND the ratchet are capable of failing. It
#                    mutates fixtures, shapes and baselines in temporary
#                    directories and asserts each one notices. This job is green
#                    and must stay green: if it goes red, no result from the other
#                    job means anything.
#
#   fixture-suite    executes every fixture against the pinned shapes and prints
#                    the full report, then ratchets that report against
#                    KNOWN_FAILURES.json. The suite is still red on its own terms
#                    and the report still names every failure; the JOB is green
#                    only when nothing got worse and nothing got better without
#                    the record being updated.
#
#   literal-fidelity checks that parsing a fixture does not change the literals it
#                    authored. rdflib rewrites the lexical form of a typed literal
#                    on parse unless NORMALIZE_LITERALS is off, and a rewritten
#                    literal is a different RDF term (RDF 1.1 Concepts 3.3), so
#                    this is the runner reading a document nobody wrote.
#
#                    REPORT-ONLY ON PURPOSE, for now. The check is new and its
#                    Turtle scanner is the only reader of this corpus that is not
#                    rdflib, so a red result here could still be the scanner's
#                    fault rather than the repository's. Running it non-gating
#                    first lets that be observed across real pull requests before
#                    anything is blocked on it. It is expected to report zero; if
#                    it holds at zero it should be promoted to a gate by dropping
#                    `--report-only`, and the promotion is a deliberate change
#                    with its own pull request, not a drive-by.
#
# What must never happen: making this green by skipping a fixture, relaxing an
# assertion, or letting the baseline absorb a failure this repository could have
# fixed. The baseline is legitimate only because it fails in both directions —
# see README.md, "Current status", and scripts/check_baseline.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  runner-selftest:
    name: runner mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check out the pinned spec revision
        run: |
          set -euo pipefail
          COMMIT="$(grep '^commit=' scripts/SPEC_PIN | cut -d= -f2)"
          REPO_URL="$(grep '^repo=' scripts/SPEC_PIN | cut -d= -f2)"
          echo "Pinned spec commit: ${COMMIT}"
          git clone --quiet "${REPO_URL}.git" "${RUNNER_TEMP}/spec"
          git -C "${RUNNER_TEMP}/spec" checkout --quiet "${COMMIT}"
          echo "CASCADE_SPEC_DIR=${RUNNER_TEMP}/spec" >> "$GITHUB_ENV"

      - name: Mutation tests
        # pipefail is NOT on by default in an Actions `run:` step, so a bare
        # `python ... | tee` would report the exit code of tee (always 0) and
        # turn a failing suite green.
        run: |
          set -o pipefail
          python scripts/selftest_runner.py --spec-dir "$CASCADE_SPEC_DIR" | tee selftest.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Runner mutation tests'
            echo '```'
            cat selftest.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  literal-fidelity:
    name: typed-literal fidelity (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Compare every authored typed literal against what rdflib returns
        # --report-only makes this exit 0 whatever it finds, so this step cannot
        # turn the workflow red while the check is being trialled. The report is
        # still printed in full and lands in the job summary below. Drop the flag
        # to turn it into a gate; nothing else needs to change.
        #
        # Not piped into tee: --report-only means the exit code carries no
        # information, but exit 2 (the scanner and the parser disagree about what
        # this repository contains) still does, and a pipe would hide it.
        run: |
          set +e
          python scripts/check_literal_fidelity.py --report-only > literal-fidelity.txt 2>&1
          rc=$?
          set -e
          cat literal-fidelity.txt
          if [ "$rc" -ge 2 ]; then
            echo "::warning::literal fidelity self-check failed (exit $rc); the report above is not usable"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## Typed-literal fidelity (report-only, non-gating)'
            echo '```'
            cat literal-fidelity.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fixture-suite:
    name: fixture suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check out the pinned spec revision
        run: |
          set -euo pipefail
          COMMIT="$(grep '^commit=' scripts/SPEC_PIN | cut -d= -f2)"
          REPO_URL="$(grep '^repo=' scripts/SPEC_PIN | cut -d= -f2)"
          echo "Pinned spec commit: ${COMMIT}"
          git clone --quiet "${REPO_URL}.git" "${RUNNER_TEMP}/spec"
          git -C "${RUNNER_TEMP}/spec" checkout --quiet "${COMMIT}"
          echo "CASCADE_SPEC_DIR=${RUNNER_TEMP}/spec" >> "$GITHUB_ENV"

      - name: Run every fixture against the pinned shapes
        # Deliberately NOT piped. A pipe would report tee's exit code, and the
        # runner's codes are load-bearing here: 1 means fixtures failed (expected,
        # the ratchet decides what to do about it) while 2 means the runner's own
        # self-checks failed, which is fatal and must stop the job before anything
        # reads its output.
        run: |
          set +e
          python scripts/run_conformance.py \
            --spec-dir "$CASCADE_SPEC_DIR" \
            --json conformance-results.json > conformance.txt 2>&1
          rc=$?
          set -e
          cat conformance.txt
          if [ "$rc" -ge 2 ]; then
            echo "::error::runner self-check failed (exit $rc); no result from this run is usable"
            exit "$rc"
          fi

      - name: Ratchet against the known-failure baseline
        # Fails when a failure appears that KNOWN_FAILURES.json does not list, AND
        # when a listed failure starts passing. The second is not a courtesy: it is
        # what stops the baseline becoming a suppression list.
        run: |
          set -o pipefail
          python scripts/check_baseline.py \
            --results conformance-results.json | tee baseline.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Ratchet'
            echo '```'
            cat baseline.txt 2>/dev/null || echo '(the ratchet did not run)'
            echo '```'
            echo '## Fixture suite'
            echo '```'
            sed -n '1,60p' conformance.txt 2>/dev/null || echo '(no output)'
            echo '```'
            echo '<details><summary>Full report, every fixture and every failure</summary>'
            echo
            echo '```'
            cat conformance.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance.txt
            conformance-results.json
            baseline.txt
          if-no-files-found: warn
